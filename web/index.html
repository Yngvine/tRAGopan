<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navarra IDENA - Prototipo límites</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      .wrap { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
      .panel { padding: 1rem; border-right: 1px solid #ddd; overflow: auto; }
      .row { margin-bottom: 0.75rem; }
      input, select, button { width: 100%; padding: 0.6rem; box-sizing: border-box; }
      button { cursor: pointer; }
      #map { height: 100%; }
      .hint { font-size: 0.9rem; color: #666; }
      ul { padding-left: 1.2rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h2>IDENA Navarra</h2>
        <p class="hint">Busca municipios o valles y pinta su delimitación.</p>

        <div class="row">
          <label for="tipo">Tipo de zona</label>
          <select id="tipo">
            <option value="municipio">Municipio</option>
            <option value="valle">Valle</option>
          </select>
        </div>

        <div class="row">
          <label for="nombre">Nombre (ej. Villava)</label>
          <input id="nombre" type="text" value="Villava" />
        </div>

        <div class="row">
          <button id="buscar">Buscar límite</button>
        </div>

        <h3>Toponimia rápida</h3>
        <div class="row">
          <input id="toponimo" type="text" placeholder="Buscar topónimo" />
        </div>
        <div class="row">
          <button id="buscarTop">Buscar topónimos</button>
        </div>
        <ul id="resultados"></ul>
      </div>
      <div id="map"></div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const map = L.map('map').setView([42.65, -1.65], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      let activeLayer = null;

      function paintGeoJSON(geojson) {
        if (activeLayer) {
          map.removeLayer(activeLayer);
        }
        activeLayer = L.geoJSON(geojson, {
          style: {
            color: '#e11d48',
            weight: 3,
            fillOpacity: 0.15
          },
          pointToLayer: (_, latlng) => L.circleMarker(latlng, { radius: 6, color: '#2563eb' })
        }).addTo(map);

        const bounds = activeLayer.getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds, { padding: [30, 30] });
        }
      }

      async function fetchJSON(url) {
        const res = await fetch(url);
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${res.status}`);
        }
        return await res.json();
      }

      document.getElementById('buscar').addEventListener('click', async () => {
        const tipo = document.getElementById('tipo').value;
        const nombre = document.getElementById('nombre').value.trim();
        if (!nombre) return;

        try {
          const endpoint = tipo === 'municipio'
            ? `/api/municipios/${encodeURIComponent(nombre)}/limite`
            : `/api/valles/${encodeURIComponent(nombre)}/limite`;

          const data = await fetchJSON(endpoint);
          if (!data.features || data.features.length === 0) {
            alert('Sin resultados');
            return;
          }
          paintGeoJSON(data);
        } catch (err) {
          alert(`Error: ${err.message}`);
        }
      });

      document.getElementById('buscarTop').addEventListener('click', async () => {
        const q = document.getElementById('toponimo').value.trim();
        if (!q) return;

        const ul = document.getElementById('resultados');
        ul.innerHTML = '';

        try {
          const data = await fetchJSON(`/api/toponimos?q=${encodeURIComponent(q)}&limit=10`);
          const feats = data.features || [];
          for (const f of feats) {
            const li = document.createElement('li');
            const p = f?.properties || {};
            const nombre = p.TOPONIMO || p.toponimo || p.NOMBRE || p.nombre || 'Sin nombre';
            const municipio = p.MUNICIPIO || p.municipio || '';
            li.textContent = municipio ? `${nombre} (${municipio})` : nombre;
            li.style.cursor = 'pointer';
            li.onclick = () => paintGeoJSON({ type: 'FeatureCollection', features: [f] });
            ul.appendChild(li);
          }
        } catch (err) {
          alert(`Error: ${err.message}`);
        }
      });
    </script>
  </body>
</html>
